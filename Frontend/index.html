<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/centered_modern_minimalist_app_icon_and_favicon_for_ace_cv._sleek_geometric.png"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#151515"
    />

    <title>ACE_CV</title>

    <style>
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 40%, rgba(213, 0, 134, 0.12), transparent 42%),
          #101010;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }

      .startup-content {
        width: min(360px, 100%);
        text-align: center;
      }

      .startup-logo {
        color: #ff91c7;
        font-size: clamp(28px, 8vw, 36px);
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      .startup-message {
        margin: 12px 0 24px;
        color: #c9c9c9;
        font-size: 14px;
      }

      .startup-track {
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #333;
      }

      .startup-bar {
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #d50086;
        animation: startup-loading 1.35s ease-in-out infinite;
      }

      .startup-caption {
        display: block;
        margin-top: 12px;
        color: #888;
        font-size: 12px;
      }

      .startup-error {
        display: none;
        margin-top: 20px;
        color: #f0b5d5;
        font-size: 13px;
        line-height: 1.5;
      }

      .startup-retry {
        display: none;
        margin-top: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #d50086;
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      #startup-loader.startup-loader--error .startup-caption,
      #startup-loader.startup-loader--error .startup-track {
        display: none;
      }

      #startup-loader.startup-loader--error .startup-error,
      #startup-loader.startup-loader--error .startup-retry {
        display: block;
        margin-inline: auto;
      }

      #startup-loader.startup-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes startup-loading {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(270%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-bar {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-loader" role="status" aria-live="polite">
      <div class="startup-content">
        <div class="startup-logo">ACE_CV</div>

        <p class="startup-message">
          Preparing your workspace...
        </p>

        <div class="startup-track">
          <div class="startup-bar"></div>
        </div>

        <span class="startup-caption">
          Initializing application
        </span>
        <p class="startup-error" id="startup-error" role="alert">
          The application could not start. Check your connection and try again.
        </p>
        <button class="startup-retry" type="button" onclick="window.location.reload()">
          Try again
        </button>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (() => {
        const loader = document.getElementById("startup-loader");
        const showStartupError = () => {
          if (!document.documentElement.dataset.aceMounted) {
            loader?.classList.add("startup-loader--error");
          }
        };

        window.setTimeout(showStartupError, 20000);
        window.addEventListener("error", showStartupError);
        window.addEventListener("unhandledrejection", showStartupError);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
